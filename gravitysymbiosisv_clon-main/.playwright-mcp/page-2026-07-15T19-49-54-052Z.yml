      - generic [ref=f98e23]: // Privacidad
      - heading "POLÍTICA DE PRIVACIDAD" [level=2] [ref=f98e24]
    - generic [ref=f98e27]:
      - paragraph [ref=f98e28]:
        - strong [ref=f98e29]: "Última actualización:"
        - text: Julio 2026
      - paragraph [ref=f98e30]: En Gravity Symbiosis AI ("Gravity", "nosotros", "nuestro"), nos comprometemos a proteger tu privacidad. Esta política describe cómo recopilamos, usamos y compartimos tu información cuando utilizas nuestra plataforma de entrenamiento y coaching de ventas.
      - heading "1. Información que recopilamos" [level=3] [ref=f98e31]
      - paragraph [ref=f98e32]: "Recopilamos información que nos proporcionas directamente: nombre, correo electrónico, número de teléfono, nombre de la empresa y rol laboral. También recopilamos datos de uso de la plataforma, incluyendo grabaciones de voz, sesiones de entrenamiento, y métricas de rendimiento."
      - heading "2. Cómo usamos tu información" [level=3] [ref=f98e33]
      - paragraph [ref=f98e34]: "Usamos tu información para: (a) proporcionar y mejorar nuestros servicios de entrenamiento de ventas, (b) generar análisis y recomendaciones personalizadas, (c) comunicarnos contigo sobre actualizaciones del servicio, (d) cumplir con obligaciones legales."
      - heading "3. Protección de datos" [level=3] [ref=f98e35]
      - paragraph [ref=f98e36]: Implementamos medidas de seguridad técnicas y organizativas para proteger tu información contra acceso no autorizado, alteración, divulgación o destrucción. Todas las comunicaciones están cifradas mediante SSL/TLS.
      - heading "4. Tus derechos" [level=3] [ref=f98e37]
      - paragraph [ref=f98e38]: Tienes derecho a acceder, corregir, eliminar y portar tus datos personales. Puedes ejercer estos derechos contactándonos a través de los canales indicados en nuestra página de contacto.
      - heading "5. Contacto" [level=3] [ref=f98e39]
      - paragraph [ref=f98e40]: Si tienes preguntas sobre esta política, escríbenos a contacto@gravitysymbiosis.com
