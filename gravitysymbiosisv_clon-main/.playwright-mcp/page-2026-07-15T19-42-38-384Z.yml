      - generic [ref=f68e28]:
        - paragraph [ref=f68e29]:
          - strong [ref=f68e30]: "Última actualización:"
          - text: Julio 2026
        - paragraph [ref=f68e31]: En Gravity Symbiosis AI ("Gravity", "nosotros", "nuestro"), nos comprometemos a proteger tu privacidad. Esta política describe cómo recopilamos, usamos y compartimos tu información cuando utilizas nuestra plataforma de entrenamiento y coaching de ventas.
        - heading "1. Información que recopilamos" [level=3] [ref=f68e32]
        - paragraph [ref=f68e33]: "Recopilamos información que nos proporcionas directamente: nombre, correo electrónico, número de teléfono, nombre de la empresa y rol laboral. También recopilamos datos de uso de la plataforma, incluyendo grabaciones de voz, sesiones de entrenamiento, y métricas de rendimiento."
        - heading "2. Cómo usamos tu información" [level=3] [ref=f68e34]
        - paragraph [ref=f68e35]: "Usamos tu información para: (a) proporcionar y mejorar nuestros servicios de entrenamiento de ventas, (b) generar análisis y recomendaciones personalizadas, (c) comunicarnos contigo sobre actualizaciones del servicio, (d) cumplir con obligaciones legales."
        - heading "3. Protección de datos" [level=3] [ref=f68e36]
        - paragraph [ref=f68e37]: Implementamos medidas de seguridad técnicas y organizativas para proteger tu información contra acceso no autorizado, alteración, divulgación o destrucción. Todas las comunicaciones están cifradas mediante SSL/TLS.
        - heading "4. Tus derechos" [level=3] [ref=f68e38]
        - paragraph [ref=f68e39]: Tienes derecho a acceder, corregir, eliminar y portar tus datos personales. Puedes ejercer estos derechos contactándonos a través de los canales indicados en nuestra página de contacto.
        - heading "5. Contacto" [level=3] [ref=f68e40]
        - paragraph [ref=f68e41]: Si tienes preguntas sobre esta política, escríbenos a contacto@gravitysymbiosis.com
