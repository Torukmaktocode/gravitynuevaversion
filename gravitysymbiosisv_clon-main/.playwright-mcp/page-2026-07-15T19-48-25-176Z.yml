      - generic [ref=f83e24]: // Privacidad
      - heading "POLÍTICA DE PRIVACIDAD" [level=2] [ref=f83e25]
    - generic [ref=f83e28]:
      - paragraph [ref=f83e29]:
        - strong [ref=f83e30]: "Última actualización:"
        - text: Julio 2026
      - paragraph [ref=f83e31]: En Gravity Symbiosis AI ("Gravity", "nosotros", "nuestro"), nos comprometemos a proteger tu privacidad. Esta política describe cómo recopilamos, usamos y compartimos tu información cuando utilizas nuestra plataforma de entrenamiento y coaching de ventas.
      - heading "1. Información que recopilamos" [level=3] [ref=f83e32]
      - paragraph [ref=f83e33]: "Recopilamos información que nos proporcionas directamente: nombre, correo electrónico, número de teléfono, nombre de la empresa y rol laboral. También recopilamos datos de uso de la plataforma, incluyendo grabaciones de voz, sesiones de entrenamiento, y métricas de rendimiento."
      - heading "2. Cómo usamos tu información" [level=3] [ref=f83e34]
      - paragraph [ref=f83e35]: "Usamos tu información para: (a) proporcionar y mejorar nuestros servicios de entrenamiento de ventas, (b) generar análisis y recomendaciones personalizadas, (c) comunicarnos contigo sobre actualizaciones del servicio, (d) cumplir con obligaciones legales."
      - heading "3. Protección de datos" [level=3] [ref=f83e36]
      - paragraph [ref=f83e37]: Implementamos medidas de seguridad técnicas y organizativas para proteger tu información contra acceso no autorizado, alteración, divulgación o destrucción. Todas las comunicaciones están cifradas mediante SSL/TLS.
      - heading "4. Tus derechos" [level=3] [ref=f83e38]
      - paragraph [ref=f83e39]: Tienes derecho a acceder, corregir, eliminar y portar tus datos personales. Puedes ejercer estos derechos contactándonos a través de los canales indicados en nuestra página de contacto.
      - heading "5. Contacto" [level=3] [ref=f83e40]
      - paragraph [ref=f83e41]: Si tienes preguntas sobre esta política, escríbenos a contacto@gravitysymbiosis.com
