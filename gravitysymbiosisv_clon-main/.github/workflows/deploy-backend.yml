name: Deploy Backend to Elastic Beanstalk

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EB_APPLICATION_NAME: gravity-symbiosis
  EB_ENVIRONMENT_NAME: gravity-symbiosis-prod
  S3_BUCKET: gravity-symbiosis-deployments

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set version label
        run: echo "VERSION_LABEL=app-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../deploy.zip . \
            -x "*.git*" \
            -x "*.mp3" \
            -x "*.webm" \
            -x "*.md" \
            -x "*.ps1" \
            -x "test_*.py" \
            -x "check_*.py" \
            -x "fix_*.py" \
            -x "db/*"

      - name: Upload to S3
        run: aws s3 cp deploy.zip s3://${{ env.S3_BUCKET }}/${{ env.VERSION_LABEL }}.zip --acl bucket-owner-full-control

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label ${{ env.VERSION_LABEL }} \
            --source-bundle S3Bucket="${{ env.S3_BUCKET }}",S3Key="${{ env.VERSION_LABEL }}.zip"

      - name: Wait for version to be processed
        run: |
          for i in {1..30}; do
            STATUS=$(aws elasticbeanstalk describe-application-versions \
              --application-name ${{ env.EB_APPLICATION_NAME }} \
              --version-labels ${{ env.VERSION_LABEL }} \
              --query "ApplicationVersions[0].Status" --output text)
            echo "Version status: $STATUS"
            if [ "$STATUS" = "PROCESSED" ]; then
              echo "Version ready"
              break
            elif [ "$STATUS" = "FAILED" ]; then
              echo "ERROR: Version processing failed"
              exit 1
            fi
            sleep 5
          done

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --version-label ${{ env.VERSION_LABEL }}

      - name: Wait for deployment
        run: |
          sleep 15
          for i in {1..60}; do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --application-name ${{ env.EB_APPLICATION_NAME }} \
              --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
              --query "Environments[0].Status" --output text)
            echo "[$i/60] Environment status: $STATUS"
            if [ "$STATUS" = "Ready" ]; then
              echo "Deployment complete"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "ERROR: Timeout waiting for environment to be Ready"
              exit 1
            fi
            sleep 20
          done

      - name: Verify deployment
        run: |
          DEPLOYED=$(aws elasticbeanstalk describe-environments \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --query "Environments[0].VersionLabel" --output text)
          if [ "$DEPLOYED" != "${{ env.VERSION_LABEL }}" ]; then
            echo "ERROR: EB rolled back. Expected ${{ env.VERSION_LABEL }}, deployed $DEPLOYED"
            exit 1
          fi
          echo "Deployment verified: $DEPLOYED"
