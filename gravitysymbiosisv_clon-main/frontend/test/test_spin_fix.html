<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test SPIN Selling Fix</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .info {
      color: blue;
    }
  </style>
</head>

<body>
  <h1>🧪 Prueba de Corrección - SPIN Selling</h1>
  <div id="results">
    <p class="info">Cargando...</p>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:5001';

    async function testSpinSelling() {
      const resultsDiv = document.getElementById('results');

      try {
        console.log('🔍 Probando endpoint ventas-spin...');
        const response = await fetch(`${API_URL}/conocimiento?modulo=ventas-spin`);

        if (!response.ok) {
          throw new Error(`Error del servidor: ${response.status} - ${response.statusText}`);
        }

        const data = await response.json();
        console.log('📚 Datos recibidos:', data);

        if (!Array.isArray(data) || data.length === 0) {
          throw new Error('No se encontraron datos o formato incorrecto');
        }

        resultsDiv.innerHTML = `
                    <div class="success">✅ SPIN SELLING FUNCIONA CORRECTAMENTE</div>
                    <div class="info">📊 Conceptos encontrados: ${data.length}</div>
                    <div class="info">📋 Primer concepto: "${data[0].concepto}"</div>
                    <div class="info">❓ Tiene pregunta: ${data[0].pregunta ? 'Sí' : 'No'}</div>
                    <div class="info">⚡ Tiene opciones: ${data[0].opciones && data[0].opciones.length > 0 ? data[0].opciones.length : 'No'}</div>
                    <div class="info">✔️ Respuesta: ${data[0].respuesta || 'N/A'}</div>
                `;

      } catch (error) {
        console.error('❌ Error:', error);
        resultsDiv.innerHTML = `
                    <div class="error">❌ ERROR: ${error.message}</div>
                    <div class="info">🔗 Intentando acceder a: ${API_URL}/conocimiento?modulo=ventas-spin</div>
                    <div class="info">🔍 Verifica que el backend esté corriendo en puerto 5001</div>
                `;
      }
    }

    // Ejecutar la prueba automáticamente
    testSpinSelling();
  </script>
</body>

</html>
